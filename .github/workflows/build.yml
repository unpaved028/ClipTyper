name: Build & Release ClipTyper

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  BUILD_VERSION: '1.8.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extract version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          echo "BUILD_VERSION=$version" >> $env:GITHUB_ENV
          # A tag with a suffix (v1.8.0-beta1) is a pre-release: published for testers only.
          # GitHub never returns pre-releases from /releases/latest, which is what the in-app
          # update check (all installed versions) queries, so users are not asked to update.
          $isPrerelease = $version.Contains('-')
          echo "IS_PRERELEASE=$($isPrerelease.ToString().ToLower())" >> $env:GITHUB_ENV
          echo "NOTES_VERSION=$($version.Split('-')[0])" >> $env:GITHUB_ENV

      # ── Automated Unit Tests (TD-24) ───────────────────────────
      - name: Run Unit Tests
        run: dotnet test ClipTyper.sln -c Release --verbosity normal

      # ── Portable: self-contained, settings next to EXE ─────────
      - name: Publish Portable
        run: dotnet publish ClipTyper.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true /p:Version=${{ env.BUILD_VERSION }} -o ./publish-portable

      - name: Add portable marker
        run: New-Item -Path ./publish-portable/portable.marker -ItemType File -Value "This file marks ClipTyper as running in portable mode.`nSettings are stored next to this executable."

      - name: Rename Portable exe
        run: Rename-Item ./publish-portable/ClipTyper.exe ClipTyper-Portable.exe

      # ── Slim: framework-dependent, settings next to EXE ────────
      - name: Publish Slim
        run: dotnet publish ClipTyper.csproj -c Release -r win-x64 --self-contained false /p:PublishSingleFile=true /p:Version=${{ env.BUILD_VERSION }} -o ./publish-slim

      - name: Add portable marker (Slim)
        run: New-Item -Path ./publish-slim/portable.marker -ItemType File -Value "This file marks ClipTyper as running in portable mode.`nSettings are stored next to this executable."

      - name: Rename Slim exe
        run: Rename-Item ./publish-slim/ClipTyper.exe ClipTyper-Slim.exe

      # ── Winget: self-contained, no marker (installed mode) ─────
      - name: Publish Winget
        run: dotnet publish ClipTyper.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true /p:Version=${{ env.BUILD_VERSION }} -o ./publish-winget

       # No portable.marker → installed mode (settings in %AppData%, autostart, shortcuts)

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Compile Inno Setup Installer
        run: iscc /DMyAppVersion=${{ env.BUILD_VERSION }} setup.iss

      # ── Checksums (S-04 / TD-49) ───────────────────────────────
      - name: Generate SHA256 Checksums
        shell: pwsh
        run: |
          $files = @(
            "./publish-portable/ClipTyper-Portable.exe",
            "./publish-slim/ClipTyper-Slim.exe",
            "./publish-winget/ClipTyper.exe",
            "./ClipTyper-Setup.exe"
          )
          $checksums = foreach ($f in $files) {
              if (Test-Path $f) {
                  $hash = (Get-FileHash -Path $f -Algorithm SHA256).Hash.ToLower()
                  $filename = Split-Path $f -Leaf
                  "$hash  $filename"
              }
          }
          $checksums | Out-File -FilePath SHA256SUMS.txt -Encoding ascii

      # ── Upload Artifacts ───────────────────────────────────────
      - name: Upload Portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipTyper-Portable
          path: |
            ./publish-portable/ClipTyper-Portable.exe
            ./publish-portable/portable.marker

      - name: Upload Slim artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipTyper-Slim
          path: |
            ./publish-slim/ClipTyper-Slim.exe
            ./publish-slim/portable.marker

      - name: Upload Winget artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipTyper
          path: ./publish-winget/ClipTyper.exe

      - name: Upload Installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipTyper-Setup
          path: ./ClipTyper-Setup.exe

      - name: Upload SHA256SUMS artifact
        uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: ./SHA256SUMS.txt

      # ── GitHub Release (TD-48) ─────────────────────────────────
      - name: Generate Release Notes Body
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $readme = Get-Content -Path README.md -Raw
          $version = "${{ env.BUILD_VERSION }}"
          # Pre-releases use the changelog of the version they lead up to (v1.8.0-beta1 -> ### v1.8.0)
          $notesVersion = "${{ env.NOTES_VERSION }}"
          $pattern = "(?s)### v" + [regex]::Escape($notesVersion) + "\s*\r?\n(.*?)(?=\r?\n###|\r?\n##|$)"
          if ($readme -match $pattern) {
              if ("${{ env.IS_PRERELEASE }}" -eq "true") {
                  $notes = "## v$version (test version)`n`n" +
                           "This is a test version of the upcoming v$notesVersion. It is not offered as an update inside ClipTyper. Please report problems as a GitHub issue.`n`n" +
                           "## What's new in v$notesVersion`n`n" + $Matches[1].Trim()
              } else {
                  $notes = "## What's new in v$version`n`n" + $Matches[1].Trim()
              }
              Set-Content -Path release_notes.md -Value $notes -Encoding utf8
          } else {
              Write-Error "Release notes for version v$notesVersion not found in README.md under '### v$notesVersion'. Please update README.md before tagging."
              exit 1
          }

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          generate_release_notes: false
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          make_latest: ${{ env.IS_PRERELEASE == 'true' && 'false' || 'true' }}
          files: |
            ./publish-portable/ClipTyper-Portable.exe
            ./publish-portable/portable.marker
            ./publish-slim/ClipTyper-Slim.exe
            ./publish-winget/ClipTyper.exe
            ./ClipTyper-Setup.exe
            ./SHA256SUMS.txt

      # Safety net: a pre-release must never become "latest", otherwise every installed
      # ClipTyper would offer it as an update. If it did, demote it and fail the run.
      - name: Verify pre-release is not the latest release
        if: startsWith(github.ref, 'refs/tags/v') && env.IS_PRERELEASE == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $release = gh api "repos/${{ github.repository }}/releases/tags/$tag" | ConvertFrom-Json
          $latest = gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name
          Write-Host "Release $tag prerelease=$($release.prerelease); latest release is $latest"
          if (-not $release.prerelease -or $latest -eq $tag) {
              gh release edit $tag --repo "${{ github.repository }}" --prerelease --latest=false
              Write-Error "$tag was published as a full or latest release. It has been switched to a pre-release; check the release page."
              exit 1
          }
